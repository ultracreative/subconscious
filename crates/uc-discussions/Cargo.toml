[package]
name = "uc-discussions"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Durable SQLite storage primitives for CortexKit discussions."

[[bin]]
name = "ck-uc-discussions"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
cortexkit-store-types = { git = "https://github.com/cortexkit/commons.git", rev = "99736150c6d0c769c1c7479894fba7f07c322a5f" }
subc-protocol = { path = "../subc-protocol" }
subc-client-rs = { path = "../subc-client-rs" }
subc-control = { path = "../subc-control" }
subc-transport = { path = "../subc-transport" }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
